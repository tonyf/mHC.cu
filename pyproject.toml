[build-system]
requires = ["setuptools>=45", "wheel", "torch>=2.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mhc"
version = "0.1.0"
description = "CUDA implementation of Manifold-Constrained Hyper-Connections"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = ["torch>=2.0.0"]

[project.optional-dependencies]
cute-dsl = [
    "nvidia-cutlass>=3.5.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-xdist>=3.0.0",
]
all = [
    "mhc[cute-dsl,dev]",
]

[project.urls]
Homepage = "https://github.com/AndreSlavescu/mHC.cu"
Paper = "https://arxiv.org/abs/2512.24880"

[tool.pytest.ini_options]
testpaths = ["src/python/mhc/cute_dsl/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "benchmark: marks tests as benchmarks",
]
